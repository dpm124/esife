<div class="page">

  <nav class="navbar">
    <span class="logo">🎟️ ESIentradas</span>
    <button class="btn-secondary" (click)="volver()">← Volver</button>
  </nav>

  <div class="content">

    <div class="login-card">

      <h1>{{ modoRegistro ? 'Crear cuenta' : 'Iniciar sesión' }}</h1>
      <p>{{ tokenReservaEntrada ? (modoRegistro ? 'Regístrate para completar tu compra' : 'Identifícate para completar tu compra') : (modoRegistro ? 'Crea tu cuenta' : 'Bienvenido de nuevo') }}</p>

      <div *ngIf="mensaje" class="mensaje" [class.exito]="exito">
        {{ mensaje }}
        <span *ngIf="!modoRegistro && mensaje && mensaje.includes('¿No tienes cuenta?')">
          <button class="btn-link" (click)="activarModoRegistro()">Regístrate aquí</button>
        </span>
      </div>

      <form *ngIf="!exito && !modoRegistro" (ngSubmit)="login()">
        <div class="form-group">
          <label for="name">Email</label>
          <input id="name" type="email" [(ngModel)]="name" name="name" placeholder="tu@ejemplo.com" required />
        </div>
        <div class="form-group">
          <label for="pwd">Contraseña</label>
          <input id="pwd" type="password" [(ngModel)]="pwd" name="pwd" placeholder="Tu contraseña" required />
        </div>
        <button type="submit" class="btn-primary" [disabled]="!name || !pwd || !isEmailValid()">{{ tokenReservaEntrada ? 'Completar compra' : 'Iniciar sesión' }}</button>
        <button type="button" class="btn-registro" (click)="activarModoRegistro()">¿No tienes cuenta? Regístrate</button>
        <button type="button" class="btn-link" (click)="irARecuperar()">¿Olvidaste tu contraseña?</button>  <!-- AÑADE ESTO -->
      </form>

      <form *ngIf="!exito && modoRegistro" (ngSubmit)="registrar()">
        <div class="form-group">
          <label for="nameReg">Email</label>
          <input id="nameReg" type="email" [(ngModel)]="name" name="name" placeholder="tu@ejemplo.com" required />
        </div>
        <div class="form-group">
          <label for="pwdReg">Contraseña</label>
          <input id="pwdReg" type="password" [(ngModel)]="pwd" name="pwd" placeholder="Elige una contraseña" required />
        </div>
        <button type="submit" class="btn-primary" [disabled]="!name || !pwd || !isEmailValid()">Crear cuenta</button>
        <button type="button" class="btn-registro" (click)="modoRegistro = false; mensaje = null">¿Ya tienes cuenta? Inicia sesión</button>
      </form>

      <button *ngIf="exito" class="btn-secondary" (click)="volver()">Ver más espectáculos</button>

    </div>

  </div>

</div>
