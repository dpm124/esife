<div class="page">

  <nav class="navbar">
    <span class="logo">🎟️ ESIentradas</span>
    <button class="btn-secondary" (click)="volver()">← Volver</button>
  </nav>

  <div class="content">

    <div class="login-card">
      <h1>Iniciar sesión</h1>
      <p>Identifícate para completar tu compra</p>

      <div *ngIf="mensaje" class="mensaje" [class.exito]="exito">{{ mensaje }}</div>

      <form *ngIf="!exito" (ngSubmit)="login()">
        <div class="form-group">
          <label for="name">Usuario</label>
          <input id="name" type="text" [(ngModel)]="name" name="name" placeholder="Tu usuario" required />
        </div>
        <div class="form-group">
          <label for="pwd">Contraseña</label>
          <input id="pwd" type="password" [(ngModel)]="pwd" name="pwd" placeholder="Tu contraseña" required />
        </div>
        <button type="submit" class="btn-primary" [disabled]="!name || !pwd">Completar compra</button>
      </form>

      <button *ngIf="exito" class="btn-secondary" (click)="volver()">Ver más espectáculos</button>
    </div>

  </div>

</div>
