<div class="page">

  <nav class="navbar">
    <span class="logo">🎟️ ESIentradas</span>
    <button class="btn-secondary" (click)="volver()">← Volver al login</button>
  </nav>

  <div class="content">
    <div class="card">

      <h1>Restablecer contraseña</h1>
      <p>Introduce tu nueva contraseña para recuperar el acceso a tu cuenta.</p>

      <div *ngIf="!exito">
        <div class="form-group">
          <label for="pwd">Nueva contraseña</label>
          <input id="pwd" type="password" [(ngModel)]="pwd" placeholder="Elige una contraseña segura" />
        </div>
        <button class="btn-primary" (click)="resetear()" [disabled]="!pwd">Cambiar contraseña</button>
      </div>

      <div *ngIf="mensaje" class="mensaje" [class.exito]="exito" [class.error]="!exito">
        {{ exito ? '✓ ' : '✗ ' }}{{ mensaje }}
      </div>

      <button *ngIf="exito || mensaje" class="btn-secondary full" (click)="volver()">Ir al login</button>

    </div>
  </div>

</div>
