<div>
  <h2>Restablecer contraseña</h2>

  <div *ngIf="!exito">
    <p>Introduce tu nueva contraseña:</p>
    <input type="password" [(ngModel)]="pwd" placeholder="Nueva contraseña" />
    <br/>
    <button (click)="resetear()">Cambiar contraseña</button>
  </div>

  <p *ngIf="mensaje">{{ mensaje }}</p>
  <button *ngIf="exito || mensaje" (click)="volver()">Ir al login</button>
</div>
