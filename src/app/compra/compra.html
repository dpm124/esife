<div class="page">

  <nav class="navbar">
    <span class="logo">🎟️ ESIentradas</span>
    <button class="btn-secondary" (click)="volver()">← Volver</button>
  </nav>

  <div class="content">

    <div class="event-header">
      <h1>{{ artista }}</h1>
      <p>Selecciona una entrada para comprar</p>
    </div>

    <div *ngIf="mensaje" class="mensaje">{{ mensaje }}</div>
    
    <div *ngIf="entradaSeleccionada" class="boton-compra">
      <button class="btn-primary" (click)="tramitarCompra()">Tramitar compra →</button>
    </div>

    <div class="entradas-grid">
      <div class="entrada-card" *ngFor="let entrada of entradas" [class.seleccionada]="estaSeleccionada(entrada)">
        <div class="entrada-info">
          <span class="entrada-id">Entrada #{{ entrada.id }}</span>
          <span class="entrada-precio">{{ (entrada.precio / 100).toFixed(2) }} €</span>
          <span class="entrada-zona">Zona {{ entrada.zona }}</span>
          <span class="entrada-estado" [class.disponible]="entrada.estado === 'DISPONIBLE'" [class.reservada]="entrada.estado !== 'DISPONIBLE'">
            {{ entrada.estado }}
          </span>
        </div>
        <button class="btn-primary" (click)="seleccionar(entrada)" [disabled]="entrada.estado !== 'DISPONIBLE' && !estaSeleccionada(entrada)" [class.btn-secondary]="estaSeleccionada(entrada)">{{ estaSeleccionada(entrada) ? 'Deseleccionar' : 'Seleccionar' }}</button>
      </div>
    </div>

    <p *ngIf="entradas.length === 0" class="no-data">No hay entradas disponibles.</p>

  </div>

</div>
