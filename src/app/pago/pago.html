<div class="pago-wrapper">
  <div class="pago-card">
    <h2>Finalizar Compra</h2>
    <p class="subtitulo" *ngIf="artista">Entradas para: <strong>{{ artista }}</strong></p>

    <!-- Estado: Preparando el pago -->
    <div *ngIf="estado === 'PREPARANDO'" class="alerta info">
      <p>⏳ {{ mensaje }}</p>
    </div>

    <!-- Estado: Procesando con Stripe -->
    <div *ngIf="estado === 'PROCESANDO'" class="alerta warning">
      <p>🔄 {{ mensaje }}</p>
    </div>

    <!-- Estado: Éxito -->
    <div *ngIf="estado === 'EXITOSO'" class="alerta success">
      <p>✅ {{ mensaje }}</p>
      <p><small>Redirigiendo...</small></p>
    </div>

    <!-- Estado: Error -->
    <div *ngIf="estado === 'ERROR'" class="alerta error">
      <p>❌ {{ error }}</p>
      <button (click)="volver()" class="btn btn-outline">Volver a inicio</button>
    </div>

    <!-- El Formulario de Stripe (Solo se ve cuando estamos esperando el pago) -->
    <!-- IMPORTANTE: Usamos [hidden] en vez de *ngIf para que Angular no elimine el div del código fuente y Stripe lo encuentre -->
    <div [hidden]="estado !== 'ESPERANDO_PAGO'" class="formulario-stripe">
      <p class="instrucciones">{{ mensaje }}</p>
      
      <div class="stripe-container">
        <div class="stripe-row">
          <label>Número de tarjeta</label>
          <div #cardNumberElement id="card-number-element" class="stripe-field"></div>
        </div>
        
        <div class="stripe-row-group">
          <div class="stripe-col">
            <label>Fecha de caducidad</label>
            <div #cardExpiryElement id="card-expiry-element" class="stripe-field"></div>
          </div>
          <div class="stripe-col">
            <label>CVC</label>
            <div #cardCvcElement id="card-cvc-element" class="stripe-field"></div>
          </div>
        </div>

        <div class="stripe-row">
          <label>Código postal</label>
          <input
            type="text"
            name="codigoPostal"
            [(ngModel)]="codigoPostal"
            autocomplete="postal-code"
            class="stripe-input"
            placeholder="Introduce tu código postal"
          />
        </div>
        
        <div class="stripe-row">
          <label>Código Postal</label>
          <div #postalCodeElement id="postal-code-element" class="stripe-field"></div>
        </div>
      </div>

      <div class="acciones">
        <button (click)="volver()" class="btn btn-outline" [disabled]="estado === 'PROCESANDO'">Cancelar</button>
        <button (click)="confirmarPago()" class="btn btn-primary" [disabled]="estado === 'PROCESANDO'">
          Pagar ahora
        </button>
      </div>
    </div>

  </div>
</div>
