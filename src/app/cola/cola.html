<div class="page">

  <nav class="navbar">
    <span class="logo">🎟️ ESIentradas</span>
    <button class="btn-secondary" (click)="salir()">← Volver</button>
  </nav>

  <div class="content">
    <div class="login-card">
      <h1>{{ artista }}</h1>

      <div *ngIf="!enCola">
        <p>Introduce tu email para unirte a la cola</p>
        <div class="form-group">
          <label>Email</label>
          <input type="email" [(ngModel)]="emailUsuario" placeholder="tu@email.com" />
        </div>
        <button class="btn-primary" (click)="unirse()">Unirse a la cola →</button>
        <div *ngIf="mensaje" class="mensaje">{{ mensaje }}</div>
      </div>

      <div *ngIf="enCola">
        <p>Estás en la cola de espera</p>

        <div *ngIf="mensaje" class="mensaje" [class.exito]="tieneTurno">
          {{ mensaje }}
        </div>

        <div *ngIf="!tieneTurno && posicion !== null && posicion !== undefined" class="posicion">
          <p>Personas delante de ti: <strong>{{ posicion }}</strong></p>
          <p class="aviso">Esta página se actualiza automáticamente cada 10 segundos.</p>
        </div>

        <div *ngIf="tieneTurno" class="boton-compra">
          <button class="btn-primary" (click)="comprar()">Comprar entrada →</button>
        </div>

        <button class="btn-secondary" (click)="salir()">Abandonar cola</button>
      </div>

    </div>
  </div>

</div>
